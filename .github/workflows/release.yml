name: build and release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Build
      run: make

    - name: Package
      run: |
        mkdir -p dist
        tar -czf "dist/WebCerver-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.tar.gz" -G README.md -C output WebCerver

    - name: Create release
      uses: softprops/action-gh-release@v2
      with: 
        files: dist/*
         
           